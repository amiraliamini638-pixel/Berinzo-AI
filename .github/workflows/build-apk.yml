name: Build Berinzo AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create web folder
        run: |
          mkdir -p www
          cp -r ./*.html www/ 2>/dev/null || true
          cp -r ./*.css www/ 2>/dev/null || true
          cp -r ./*.js www/ 2>/dev/null || true
          cp -r ./images www/ 2>/dev/null || true
          cp -r ./assets www/ 2>/dev/null || true

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install @capacitor/core@8.5.2 @capacitor/android@8.5.2
          npm install -D @capacitor/cli@8.5.2

          npx cap init "Berinzo AI" "com.berinzo.ai" --web-dir=www
          npx cap add android

      - name: Set Android SDK 36
        run: |
          sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 36/' android/variables.gradle
          sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 36/' android/variables.gradle

      - name: Disable text selection
        run: |
          cat >> www/index.html <<'EOF'
          <style>
          * {
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
          }

          input, textarea {
            -webkit-user-select: text !important;
            user-select: text !important;
          }
          </style>
          EOF

      - name: Hide Android system bars
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/java/com/berinzo/ai/MainActivity.java")

          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "import android.os.Bundle;",
                  """import android.os.Bundle;
          import android.view.WindowInsets;
          import android.view.WindowInsetsController;"""
              )

              s = s.replace(
                  "super.onCreate(savedInstanceState);",
                  """super.onCreate(savedInstanceState);

          if (android.os.Build.VERSION.SDK_INT >= 30) {
              getWindow().setDecorFitsSystemWindows(false);
              WindowInsetsController controller = getWindow().getInsetsController();
              if (controller != null) {
                  controller.hide(
                      WindowInsets.Type.statusBars() |
                      WindowInsets.Type.navigationBars()
                  );
                  controller.setSystemBarsBehavior(
                      WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  );
              }
          }"""
              )

              p.write_text(s)
          PY

      - name: Sync Capacitor
        run: |
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Berinzo-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
